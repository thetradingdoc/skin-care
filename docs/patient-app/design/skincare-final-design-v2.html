<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>skiñcare — final design</title>
<style>
  :root{
    --wine:#3D000B; --ground:#F3F1EF; --white:#ffffff;
    --red:#e31919; --green:#4f8a5b; --green-dark:#356140;
    --line:#e5e0d8; --sec:#8a8177; --inkline:rgba(61,0,11,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#e9e6df;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .phone{position:relative;width:340px;height:700px;border-radius:52px;background:#000;
    padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.35),0 0 0 2px #1a1a1a;}
  .screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;
    display:flex;flex-direction:column;transition:background 300ms ease,color 300ms ease;background:var(--ground);color:var(--wine);}
  .screen.dark{background:var(--wine);color:#fff;}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:120px;height:32px;background:#000;border-radius:20px;z-index:6;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;
    padding:16px 26px 0;font-size:14px;font-weight:700;position:relative;z-index:4;flex-shrink:0;}
  .statusicons{display:flex;gap:5px;align-items:center;}
  .bars{display:flex;gap:2px;align-items:flex-end;height:10px;}
  .bars span{width:3px;border-radius:1px;background:currentColor;}
  .bars span:nth-child(1){height:4px;} .bars span:nth-child(2){height:6px;}
  .bars span:nth-child(3){height:8px;} .bars span:nth-child(4){height:10px;}
  .batt{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;}
  .batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:currentColor;border-radius:1px;}
  .batt i{position:absolute;top:1.3px;left:1.3px;bottom:1.3px;width:70%;background:currentColor;border-radius:1px;display:block;}
  .progress{display:flex;gap:4px;padding:10px 16px 0;position:relative;z-index:4;flex-shrink:0;}
  .seg{flex:1;height:3px;background:var(--inkline);border-radius:2px;overflow:hidden;}
  .dark .seg{background:rgba(255,255,255,.25);}
  .seg i{display:block;height:100%;width:0%;background:var(--wine);}
  .dark .seg i{background:#fff;}
  .seg.done i{width:100%;} .seg.active i{width:100%;transition:width 6s linear;}
  .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:26px 24px;gap:13px;overflow:hidden;}
  .content.top{justify-content:flex-start;align-items:stretch;text-align:left;padding-top:18px;gap:12px;overflow-y:auto;}
  .statebadge{align-self:flex-start;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--red);border:1px solid var(--red);border-radius:6px;padding:3px 7px;margin-bottom:2px;}
  .eyebrow{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--green);font-weight:800;}
  .icon-wrap{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:2px;background:rgba(61,0,11,.08);}
  .dark .icon-wrap{background:rgba(255,255,255,.12);}
  .icon-wrap svg{width:26px;height:26px;fill:none;stroke:var(--wine);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .dark .icon-wrap svg{stroke:#fff;}
  .logo{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(227,25,25,.28));}
  .brandname{font-family:Georgia,"Iowan Old Style",serif;font-size:26px;}
  .bebold{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:800;}
  h1{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:25px;
    line-height:1.2;letter-spacing:-.015em;}
  .content.top h1{font-size:21px;}
  p.sub{font-size:14px;line-height:1.5;max-width:250px;color:var(--sec);font-weight:500;}
  .dark p.sub{color:rgba(255,255,255,.72);}
  .content.top p.sub{max-width:100%;}
  .attrib{font-size:12px;font-weight:700;margin-top:-6px;color:var(--green);}
  .tapzones{position:absolute;inset:0;display:flex;z-index:3;}
  .tapzones div{flex:1;}
  .bottombar{position:relative;z-index:4;padding:0 22px 16px;display:none;flex-direction:column;gap:9px;flex-shrink:0;align-items:center;}
  .btn{width:100%;padding:15px;border-radius:18px;text-align:center;font-size:14.5px;font-weight:700;cursor:pointer;
    background:#fff;border:1.5px solid var(--inkline);color:var(--wine);}
  .btn.solid{background:var(--wine);border:none;color:#fff;font-weight:800;}
  .btn.solid:active{background:#2a0007;}
  .btn.green{background:var(--green);border:none;color:#fff;font-weight:800;}
  .btn.green:active{background:var(--green-dark);}
  .btn.buy{background:var(--red);border:none;color:#fff;}
  .btn.danger{background:transparent;border:1.5px solid var(--red);color:var(--red);}
  .skiplink{font-size:12.5px;color:var(--sec);text-decoration:underline;cursor:pointer;font-weight:600;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px;}
  .chip{border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;
    background:rgba(61,0,11,.06);border:1.5px solid var(--inkline);color:var(--wine);}
  .chip.sel{background:var(--wine);border-color:var(--wine);color:#fff;}
  .otherbox{width:100%;margin-top:2px;}
  .field{width:100%;padding:13px 15px;border-radius:14px;font-size:13.5px;margin-bottom:10px;
    background:#fff;border:1.5px solid var(--line);color:var(--wine);font-weight:600;}
  .fieldrow{display:flex;gap:8px;}
  .fieldrow .field{margin-bottom:0;}
  .fieldlabel{font-size:11px;color:var(--sec);margin-bottom:5px;display:block;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .otpwrap{width:100%;text-align:left;}
  .otpboxes{display:flex;gap:7px;}
  .otpboxes div{width:34px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:800;background:#fff;border:1.5px solid var(--line);color:var(--wine);}
  .otpboxes div.err{border-color:var(--red);color:var(--red);}
  .errtext{font-size:11px;color:var(--red);margin-top:5px;font-weight:600;}
  .resend{font-size:11.5px;color:var(--green);text-decoration:underline;margin-top:6px;font-weight:700;}
  .plancard{width:100%;border-radius:18px;padding:16px;margin-top:2px;text-align:left;
    background:#fff;border:1.5px solid var(--line);box-shadow:0 4px 18px rgba(61,0,11,.06);}
  .plancard .ph{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--green);font-weight:800;margin-bottom:3px;}
  .plancard .pl{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--wine);}
  .plancard .pl:last-child{margin-bottom:0;}
  .marksw{display:flex;gap:6px;width:100%;overflow-x:auto;}
  .markpill{font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:20px;white-space:nowrap;flex-shrink:0;
    background:#fff;border:1.5px solid var(--line);color:var(--sec);}
  .markpill.sel{background:var(--wine);color:#fff;border-color:var(--wine);}
  .teasercard{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;text-align:left;}
  .teasercard .thead{font-size:11px;font-weight:800;color:var(--sec);margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
  .teaserimgs{display:flex;gap:8px;}
  .teaserimgs div{flex:1;aspect-ratio:1;border-radius:12px;background:var(--ground);border:1.5px dashed var(--line);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:10.5px;font-weight:700;color:var(--wine);}
  .assistant-row{display:flex;gap:8px;align-items:flex-start;width:100%;}
  .savatar{width:26px;height:26px;border-radius:50%;background:var(--green);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:2px;}
  .sbubble{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:4px 15px 15px 15px;padding:11px 13px;}
  .sbubble .stitle{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--green);font-weight:800;margin-bottom:3px;}
  .sbubble p{font-size:12.5px;line-height:1.44;color:var(--wine);font-weight:500;}
  .sactions{display:flex;gap:6px;margin-top:8px;}
  .sbtn{font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;}
  .sbtn.r{background:var(--wine);color:#fff;}
  .sbtn.g{background:transparent;border:1.5px solid var(--line);color:var(--sec);}
  .protocard{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;}
  .protocard .row2{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
  .protocard .row2 b{font-weight:700;} .protocard .row2 span{color:var(--sec);font-weight:600;}
  .primaryfab{width:100%;background:var(--wine);color:#fff;border-radius:18px;padding:16px;
    text-align:center;font-size:14.5px;font-weight:800;cursor:pointer;}
  .linklist{display:flex;gap:14px;font-size:12px;color:var(--sec);flex-wrap:wrap;font-weight:600;}
  .linklist b{color:var(--wine);font-weight:800;cursor:pointer;}
  .toggle2{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
  .toggle2 span{flex:1;text-align:center;padding:7px 0;font-size:12px;font-weight:700;border-radius:9px;color:var(--sec);cursor:pointer;}
  .toggle2 span.act{background:var(--wine);color:#fff;}
  .legend{display:flex;gap:12px;font-size:10.5px;color:var(--sec);flex-wrap:wrap;font-weight:600;}
  .legend i{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:3px;}
  .daylist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1.5px solid var(--line);}
  .dayrow{background:#fff;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .dayrow b{font-size:12.5px;font-weight:700;display:block;} .dayrow span{font-size:10.5px;color:var(--sec);font-weight:600;}
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%;}
  .monthgrid div{aspect-ratio:1;border-radius:9px;background:#fff;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sec);position:relative;font-weight:600;}
  .monthgrid div.has::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--green);}
  .compareimg{display:flex;gap:8px;width:100%;}
  .compareimg div{flex:1;aspect-ratio:.85;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-end;padding-bottom:7px;gap:2px;background:#fff;border:1.5px dashed var(--line);}
  .compareimg div b{font-size:11px;font-weight:700;} .compareimg div span{font-size:9px;color:var(--sec);font-weight:600;}
  .shelfrow{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:15px;
    padding:11px 13px;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;}
  .shelfrow .l b{font-size:12.5px;font-weight:700;display:block;} .shelfrow .l span{font-size:10.5px;color:var(--sec);font-weight:600;}
  .pill{font-size:9.5px;font-weight:800;color:var(--green-dark);background:rgba(79,138,91,.12);padding:5px 8px;border-radius:8px;white-space:nowrap;}
  .pill.auto{color:var(--sec);background:var(--ground);}
  .pdfcard{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:13px;text-align:left;}
  .pdfcard .pl2{font-size:12px;color:var(--sec);padding:3px 0;font-weight:600;}
  .pdfcard .pl2 b{color:var(--wine);}
  .pdfcard .disc{font-size:10.5px;color:var(--sec);margin-top:8px;line-height:1.4;border-top:1px solid var(--line);padding-top:8px;font-weight:500;}
  .avatar{width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:18px;
    font-weight:800;display:flex;align-items:center;justify-content:center;}
  .profrow{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:15px;
    padding:12px 14px;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:13px;font-weight:700;cursor:pointer;}
  .swtch{width:38px;height:22px;border-radius:12px;background:var(--green);position:relative;flex-shrink:0;}
  .swtch.off{background:var(--line);}
  .swtch::after{content:"";position:absolute;right:2px;top:2px;width:18px;height:18px;background:#fff;border-radius:50%;}
  .swtch.off::after{right:auto;left:2px;}
  .signout{color:var(--sec);font-weight:700;font-size:13px;text-align:left;width:100%;cursor:pointer;}
  .notifbanner{position:absolute;top:96px;left:16px;right:16px;background:rgba(28,10,14,.82);
    backdrop-filter:blur(14px);border-radius:18px;padding:12px 14px;display:flex;gap:10px;
    align-items:flex-start;z-index:7;border:1px solid rgba(255,255,255,.14);}
  .notifbanner .nicon{width:28px;height:28px;border-radius:8px;background:var(--green);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .notifbanner .nicon svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8;}
  .notifbanner b{font-size:12.5px;display:block;} .notifbanner span{font-size:11px;color:rgba(255,255,255,.72);}
  .backbar{display:flex;align-items:center;gap:8px;padding:14px 20px 0;flex-shrink:0;}
  .backbtn{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);}
  .dark .backbtn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
  .backbtn svg{width:14px;height:14px;stroke-width:2.2;fill:none;stroke:var(--wine);}
  .dark .backbtn svg{stroke:#fff;}
  .tabbar{display:flex;align-items:center;justify-content:space-around;padding:7px 6px 20px;
    background:var(--wine);flex-shrink:0;position:relative;z-index:4;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(255,255,255,.42);cursor:pointer;}
  .tab.act{color:#fff;}
  .tab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;}
  .tab span{font-size:9px;font-weight:700;}
  .tab.act .dotm{width:3.5px;height:3.5px;border-radius:50%;background:var(--green);}
  .fabtab{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;
    align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;}
  .fabtab svg{width:20px;height:20px;stroke:var(--wine);fill:none;stroke-width:1.8;}
  .navrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;width:340px;}
  .navrow button{width:36px;height:36px;border-radius:50%;border:1px solid #cfc9ba;background:#fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .navrow button svg{width:15px;height:15px;stroke:#2c2210;fill:none;stroke-width:2;}
  .jumpsel{font-size:12px;padding:8px 10px;border-radius:9px;border:1px solid #cfc9ba;background:#fff;
    color:#2c2210;max-width:300px;}
  .caption{font-size:12px;color:#6b6555;text-align:center;max-width:320px;}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <div class="statusicons">
          <div class="bars"><span></span><span></span><span></span><span></span></div>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M1 4C4 1 11 1 14 4M3.3 6.3C5.3 4.5 9.7 4.5 11.7 6.3M5.7 8.5C6.8 7.6 8.2 7.6 9.3 8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <div class="batt"><i></i></div>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="backbar" id="backbar" style="display:none"></div>
      <div class="content" id="body"></div>
      <div class="bottombar" id="bottombar"></div>
      <div class="tabbar" id="tabbar" style="display:none"></div>
      <div class="tapzones" id="tapzones"></div>
    </div>
  </div>
  <div class="navrow">
    <button onclick="prevOnboard()" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <select class="jumpsel" id="jump" onchange="jumpTo(this.value)"></select>
    <button onclick="nextOnboard()" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <p class="caption" id="caption"></p>
</div>

function selChip(el,groupId){
  document.querySelectorAll('#'+groupId+' .chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function showOther(){ document.getElementById('otherbox').style.display='block'; }

function tab(name,label,active){
  const map={calendar:'calendar',shelf:'bottle',progress:'home',profile:'user'};
  return `<div class="tab ${active?'act':''}" onclick="jumpTo('${name}')">${svg(map[name])}<span>${label}</span>${active?'<div class="dotm"></div>':''}</div>`;
}
function tabbarHTML(active){
  return `${tab('calendar','Calendar',active==='calendar')}${tab('shelf','Shelf',active==='shelf')}
  <div class="fabtab" onclick="jumpTo('track-mark')">${svg('camera')}</div>
  ${tab('progress','Progress',active==='progress')}${tab('profile','Profile',active==='profile')}`;
}

let mode = 'onboard';
let oi = 0;
let curSub = 'progress';

const screenEl = document.getElementById('screen');
const bodyEl = document.getElementById('body');
const bottomEl = document.getElementById('bottombar');
const progEl = document.getElementById('progress');
const backEl = document.getElementById('backbar');
const tabEl = document.getElementById('tabbar');
const jumpEl = document.getElementById('jump');
const capEl = document.getElementById('caption');

function buildProgress(){ progEl.innerHTML = onboard.map(()=>'<div class="seg"><i></i></div>').join(''); }

function buildJump(){
  let html = `<optgroup label="Onboarding">`;
  onboard.forEach(s=>{ html += `<option value="${s.id}">${s.label}</option>`; });
  html += `</optgroup>`;
  const sections = {};
  Object.keys(app).forEach(id=>{
    const s = app[id];
    if(!sections[s.section]) sections[s.section]=[];
    sections[s.section].push({id, label:s.label});
  });
  Object.keys(sections).forEach(sec=>{
    html += `<optgroup label="${sec}">`;
    sections[sec].forEach(o=>{ html += `<option value="${o.id}">${o.label}</option>`; });
    html += `</optgroup>`;
  });
  jumpEl.innerHTML = html;
}

function renderOnboard(){
  progEl.style.display='flex'; backEl.style.display='none'; tabEl.style.display='none';
  const tapEl = document.getElementById('tapzones');
  tapEl.style.display='flex'; tapEl.innerHTML = '<div onclick="prevOnboard()"></div><div onclick="nextOnboard()"></div>';
  const s = onboard[oi];
  screenEl.className = 'screen';
  bodyEl.className = 'content';
  bodyEl.innerHTML = s.body;
  bottomEl.style.display = s.cta ? 'flex':'none';
  bottomEl.innerHTML = s.cta||'';
  document.querySelectorAll('.seg').forEach((seg,idx)=>{
    seg.classList.remove('done','active');
    if(idx<oi) seg.classList.add('done'); if(idx===oi) seg.classList.add('active');
  });
  jumpEl.value = s.id;
  capEl.textContent = `Onboarding ${oi+1} / ${onboard.length}`;
}
function nextOnboard(){
  if(mode!=='onboard') return;
  if(oi < onboard.length-1 && onboard[oi].id!=='o8b'){ oi++; renderOnboard(); }
  else if(oi===onboard.length-1){ enterApp(); }
}
function prevOnboard(){ if(mode!=='onboard') return; oi=Math.max(0,oi-1); renderOnboard(); }
function enterApp(){ mode='app'; curSub='progress'; renderApp(); }

function renderApp(){
  progEl.style.display='none';
  const tapEl = document.getElementById('tapzones');
  tapEl.style.display='none'; tapEl.innerHTML='';
  const s = app[curSub];
  screenEl.className = 'screen' + (s.dark?' dark':'');
  bodyEl.className = 'content top';
  bodyEl.innerHTML = s.body;
  if(s.back){
    backEl.style.display='flex';
    backEl.innerHTML = `<div class="backbtn" onclick="jumpTo('${s.back}')">${svg('back')}</div>`;
  } else { backEl.style.display='none'; backEl.innerHTML=''; }
  if(s.cta){ bottomEl.style.display='flex'; bottomEl.innerHTML=s.cta; }
  else { bottomEl.style.display='none'; bottomEl.innerHTML=''; }
  if(s.tabbar){ tabEl.style.display='flex'; tabEl.innerHTML = tabbarHTML(curSub); }
  else { tabEl.style.display='none'; tabEl.innerHTML=''; }
  jumpEl.value = curSub;
  capEl.textContent = `${s.section} · ${s.label}`;
}
function jumpTo(id){
  if(onboard.find(o=>o.id===id)){
    mode='onboard'; oi = onboard.findIndex(o=>o.id===id); renderOnboard(); return;
  }
  mode='app'; curSub=id; renderApp();
}
document.addEventListener('keydown', e=>{
  if(mode==='onboard'){ if(e.key==='ArrowRight') nextOnboard(); if(e.key==='ArrowLeft') prevOnboard(); }
});
buildProgress();
buildJump();
renderOnboard();
</script>
