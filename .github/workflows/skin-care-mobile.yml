name: Skin & Care Mobile (staging)

on:
  push:
    branches: [main]
    paths:
      - 'patient-app/**'
      - 'middleware-platform/services/care-program-billing-service.js'
      - 'middleware-platform/services/record-field-templates.js'
      - 'middleware-platform/services/record-field-templates/**'
      - 'middleware-platform/__tests__/record-field-templates.test.js'
      - 'patient-app/lib/record-field-templates.ts'
      - 'middleware-platform/routes/patient-billing-portal.js'
      - 'middleware-platform/__tests__/care-program-billing-service.test.js'
      - '.github/workflows/skin-care-mobile.yml'
  pull_request:
    paths:
      - 'patient-app/**'
      - 'middleware-platform/services/record-field-templates.js'
      - 'middleware-platform/services/record-field-templates/**'
      - 'middleware-platform/__tests__/record-field-templates.test.js'
      - 'patient-app/lib/record-field-templates.ts'
      - '.github/workflows/skin-care-mobile.yml'
  workflow_dispatch:

concurrency:
  group: skin-care-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  BRAND_PROFILE: skin-and-care
  CI_PROFILE: skin-care

jobs:
  field-templates-parity:
    name: Field-template client/server parity (APP-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: middleware-platform/package-lock.json

      - name: Install middleware dependencies
        working-directory: ./middleware-platform
        run: npm ci

      - name: Client mirror parity (must fail on catalog/key drift)
        working-directory: ./middleware-platform
        run: npm run test:field-templates-parity

  typecheck:
    name: patient-app typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: patient-app/package-lock.json

      - name: Brand guard (consumer profile)
        run: node scripts/check-brand-strings.cjs

      - name: Install patient-app dependencies
        working-directory: ./patient-app
        run: npm ci

      - name: Typecheck patient-app
        working-directory: ./patient-app
        run: npx tsc --noEmit

      - name: Unit tests (patient-app vitest)
        working-directory: ./patient-app
        run: npm test

  care-program-api:
    name: care_program billing tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: middleware-platform/package-lock.json

      - name: Install middleware dependencies
        working-directory: ./middleware-platform
        run: npm ci

      - name: Run care-program billing tests
        working-directory: ./middleware-platform
        run: npm test -- --testPathPattern='care-program|stripe-webhook-care' --runInBand

  consumer-prod-ready:
    name: consumer prod-ready gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: middleware-platform/package-lock.json

      - name: Install root + middleware + patient-app
        run: |
          npm ci
          npm ci --prefix middleware-platform
          npm ci --prefix patient-app

      - name: Install Playwright Chromium
        working-directory: ./middleware-platform
        run: npx playwright install chromium

      - name: Build consumer hosting + run test:consumer-prod-ready
        run: |
          npm run build:consumer-hosting
          npm run test:consumer-prod-ready --prefix middleware-platform

  eas-preview:
    name: EAS iOS preview build
    needs: [typecheck, care-program-api, consumer-prod-ready]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: patient-app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS preview build (internal device link)
        working-directory: ./patient-app
        run: npx eas-cli build --platform ios --profile preview --non-interactive --no-wait
